spring.application.name=rating
server.port=${SERVER_PORT:8080}

# MongoDB Configuration
spring.mongodb.host=${MONGODB_HOST:devoops-mongodb}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=rating_db
spring.mongodb.username=${MONGODB_USERNAME:devoops}
spring.mongodb.password=${MONGODB_PASSWORD:devoops}
spring.mongodb.authentication-database=admin
spring.mongodb.representation.uuid=standard

# Logging configuration
logging.logstash.host=${LOGSTASH_HOST:localhost:5000}
logging.level.root=INFO
logging.level.com.devoops=DEBUG
logging.level.org.springframework.web=INFO
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:zipkin}:${ZIPKIN_PORT:9411}/api/v2/spans

# Actuator endpoints for Prometheus metrics
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# gRPC Client - User Service
grpc.client.user-service.address=static://${USER_GRPC_HOST:devoops-user-service}:${USER_GRPC_PORT:9090}
grpc.client.user-service.negotiationType=plaintext

# gRPC Client - Reservation Service
grpc.client.reservation-service.address=static://${RESERVATION_GRPC_HOST:devoops-reservation-service}:${RESERVATION_GRPC_PORT:9090}
grpc.client.reservation-service.negotiationType=plaintext

# gRPC Client - Accommodation Service
grpc.client.accommodation-service.address=static://${ACCOMMODATION_GRPC_HOST:devoops-accommodation-service}:${ACCOMMODATION_GRPC_PORT:9090}
grpc.client.accommodation-service.negotiationType=plaintext

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:devoops-rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:devoops}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:devoops123}

# RabbitMQ routing
rabbitmq.exchange.notification=notification.exchange
rabbitmq.routing-key.host-rated=notification.rating.host
rabbitmq.routing-key.accommodation-rated=notification.rating.accommodation
