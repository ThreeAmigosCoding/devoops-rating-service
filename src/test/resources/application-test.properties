spring.application.name=rating-test

# Disable tracing in tests
management.tracing.export.enabled=false

# Disable RabbitMQ autoconfiguration (RatingEventPublisherService is mocked in tests)
spring.autoconfigure.exclude=org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

# gRPC client stubs (won't connect; clients are mocked with @MockitoBean)
grpc.client.user-service.address=static://localhost:9090
grpc.client.user-service.negotiationType=plaintext
grpc.client.reservation-service.address=static://localhost:9090
grpc.client.reservation-service.negotiationType=plaintext
grpc.client.accommodation-service.address=static://localhost:9090
grpc.client.accommodation-service.negotiationType=plaintext

# RabbitMQ routing keys (required by RabbitMQConfig @Value fields even when the broker is absent)
rabbitmq.exchange.notification=notification.exchange
rabbitmq.routing-key.host-rated=notification.rating.host
rabbitmq.routing-key.accommodation-rated=notification.rating.accommodation

# MongoDB placeholder URI (overridden by @DynamicPropertySource in integration tests)
spring.mongodb.uri=mongodb://localhost:27017/rating_test

logging.level.com.devoops=DEBUG
